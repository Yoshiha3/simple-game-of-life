<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ライフゲーム</title>
</head>
<body>
  <canvas id="canvas"></canvas>
  <script>
    const canvas = document.querySelector("#canvas");
    const context = canvas.getContext("2d");

    const CANVAS_SIZE = 500;
    canvas.width = CANVAS_SIZE;
    canvas.height = CANVAS_SIZE;

    const GAME_SIZE = 10;
    const CELL_SIZE = CANVAS_SIZE / GAME_SIZE;

    let field = initField();

    function drawCell(x, y) {
      const drawX = x * CELL_SIZE;
      const drawY = y * CELL_SIZE;
      context.fillRect(drawX, drawY, CELL_SIZE, CELL_SIZE);
    }

    function drawField(field) {
      context.clearRect(0, 0, CANVAS_SIZE, CANVAS_SIZE);

      for(let y = 0; y < field.length; y++) {
        for(let x = 0; x < field[y].length; x++) {

          if(field[y][x] === 0) continue;

          drawCell(x, y);

        }
      }
    }

    function initField() {
      return Array.from({ length: GAME_SIZE }, () => 
        Array.from({ length: GAME_SIZE }, () => 
          Math.random() > 0.5 ? 1 : 0
        )
      );
    }

    function isInField(x, y) {
      return (
        0 <= x && x < GAME_SIZE &&
        0 <= y && y < GAME_SIZE
      );
    }
    
    function countNeighborLivingCells(field, x, y) {
      let count = 0;

      for(let dx = -1; dx <= 1; dx++) {
        for(let dy = -1; dy <= 1; dy++) {

          if(dx === 0 && dy === 0) continue;

          const checkX = x + dx;
          const checkY = y + dy;

          if(!isInField(checkX, checkY)) continue;

          if(field[checkY][checkX] === 1) count++;

        }
      }

      return count;
    }

    function updateField(field) {
      return field.map((row, y) => 
        row.map((cell, x) => {

          const livingCells = countNeighborLivingCells(field, x, y);

          if(cell === 1) {
            return (livingCells === 2 || livingCells === 3) ? 1 : 0;
          } else {
            return livingCells === 3 ? 1 : 0;
          }

        })
      );
    }

    function gameLoop() {
      field = updateField(field);
      drawField(field);
    }

    setInterval(gameLoop, 1000 / 4);
  </script>
</body>
</html>
